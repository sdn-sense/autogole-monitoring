        port: 1094
      - host: redir-f017.t2.ucsd.edu
        port: 1094
      - host: redir-f018.t2.ucsd.edu
        port: 1094
      - host: redir-f01a.t2.ucsd.edu
        port: 1094
      - host: redir-f01b.t2.ucsd.edu
        port: 1094
      - host: redir-f01c.t2.ucsd.edu
        port: 1094
      - host: redir-f01d.t2.ucsd.edu
        port: 1094
      - host: redir-f01e.t2.ucsd.edu
        port: 1094
      - host: redir-f01f.t2.ucsd.edu
        port: 1094
