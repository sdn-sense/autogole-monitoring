# This is the default configuration used by SENSE.
# Only adding default configuration parameters, which
# are not automatically scanned, parsed from SiteFE configs
global:
  scrape_interval:     60s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 60s # Evaluate rules every 15 seconds. The default is every 1 minute.
  scrape_timeout: 50s # Timeout after 30sec. Default is 10s and is too low

# Alertmanager configuration
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - localhost:9093

# A scrape configuration containing exactly one endpoint to scrape
scrape_configs:

- job_name: PACWAVE_SNMPMon
  metrics_path: /metrics
  relabel_configs:
  - replacement: NSI_PACWAVE
    source_labels:
    - __address__
    target_label: nsisitename
  - replacement: NSI-SNMPMon
    source_labels:
    - __address__
    target_label: software
  - replacement: 37.876
    source_labels:
    - __address__
    target_label: latitude
  - replacement: -122.253
    source_labels:
    - __address__
    target_label: longitude
  scheme: https
  scrape_interval: 30s
  static_configs:
  - targets:
    - nsi-snmpmon-cenic.nrp-nautilus.io
  tls_config:
    cert_file: /etc/tls/tls.crt
    insecure_skip_verify: true
    key_file: /etc/tls/tls.key
- job_name: Internet2_SNMPMon
  metrics_path: /metrics
  relabel_configs:
  - replacement: Internet2
    source_labels:
    - __address__
    target_label: nsisitename
  - replacement: NSI-SNMPMon
    source_labels:
    - __address__
    target_label: software
  - replacement: 37.876
    source_labels:
    - __address__
    target_label: latitude
  - replacement: -122.253
    source_labels:
    - __address__
    target_label: longitude
  scheme: https
  scrape_interval: 30s
  static_configs:
  - targets:
    - nsi-snmpmon-internet2.nrp-nautilus.io
  tls_config:
    cert_file: /etc/tls/tls.crt
    insecure_skip_verify: true
    key_file: /etc/tls/tls.key
- job_name: DMMMON
  metrics_path: metrics
  scheme: https
  scrape_interval: 30s
  static_configs:
  - targets:
    - dmm.nrp-nautilus.io:433


- authorization:
    credentials_file: /etc/oidc/oidc-nrm_cenic.token
  job_name: NRM_CENIC_STATE
  metrics_path: /api/NRM_CENIC/monitoring/prometheus/metrics
  relabel_configs:
  - replacement: NRM_CENIC
    source_labels:
    - __address__
    target_label: sitename
  - replacement: SiteRM
    source_labels:
    - __address__
    target_label: software
  - replacement: 33.9416
    source_labels:
    - __address__
    target_label: latitude
  - replacement: -118.4085
    source_labels:
    - __address__
    target_label: longitude
  scheme: https
  scrape_interval: 30s
  static_configs:
  - targets:
    - siterm.apps.cenic.org:443 
- authorization:
    credentials_file: /etc/oidc/oidc-nrm_cenic.token
  job_name: NRM_CENIC_STATEHTTP
  metrics_path: /siterm-http-status
  relabel_configs:
  - replacement: NRM_CENIC
    source_labels:
    - __address__
    target_label: sitename
  - replacement: SiteRM-HTTP
    source_labels:
    - __address__
    target_label: software
  - replacement: 33.9416
    source_labels:
    - __address__
    target_label: latitude
  - replacement: -118.4085
    source_labels:
    - __address__
    target_label: longitude
  scheme: https
  scrape_interval: 30s
  static_configs:
  - targets:
    - siterm.apps.cenic.org:443 
- job_name: NRM_CENIC_MODEL_V4
  metrics_path: /probe
  params:
    module:
    - v4_nrm_cenic
  relabel_configs:
  - replacement: NRM_CENIC
    source_labels:
    - __address__
    target_label: sitename
  - replacement: SiteRM
    source_labels:
    - __address__
    target_label: software
  - replacement: 33.9416
    source_labels:
    - __address__
    target_label: latitude
  - replacement: -118.4085
    source_labels:
    - __address__
    target_label: longitude
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - __param_target
    target_label: instance
  - replacement: prometheus-blackbox-exporter-service:9115
    target_label: __address__
  scrape_interval: 30s
  static_configs:
  - targets:
    - https://siterm.apps.cenic.org:443/api/NRM_CENIC/models?current=true&summary=false&encode=false
- job_name: NRM_CENIC_ICMP_V4
  metrics_path: /probe
  params:
    module:
    - icmp_v4
  relabel_configs:
  - replacement: NRM_CENIC
    source_labels:
    - __address__
    target_label: sitename
  - replacement: SiteRM
    source_labels:
    - __address__
    target_label: software
  - replacement: 33.9416
    source_labels:
    - __address__
    target_label: latitude
  - replacement: -118.4085
    source_labels:
    - __address__
    target_label: longitude
  - replacement: v4
    source_labels:
    - __address__
    target_label: ipversion
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - __param_target
    target_label: instance
  - replacement: prometheus-blackbox-exporter-service:9115
    target_label: __address__
  scrape_interval: 30s
  static_configs:
  - targets:
    - siterm.apps.cenic.org 
